services:
  db:
    image: postgres:16
    restart: always
    ports:
      - 5433:5432
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: postgres
      TZ: UTC
    volumes:
      - dbData:/var/lib/postgresql/data
    networks:
      - kanban-net

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080
    depends_on:
      - db
    networks:
      - kanban-net

  redis:
    image: redis:8.8.0
    restart: always
    ports:
      - 6379:6379
    command: redis-server --requirepass devpassword
    volumes:
      - redisData:/var/lib/redis/data
    networks:
      - kanban-net

  redis-ui:
    image: rediscommander/redis-commander:latest
    ports:
      - "82:8081"
    environment:
      REDIS_HOSTS: "local:redis:6379:0:devpassword:kanban"
    depends_on:
      - redis
    networks:
      - kanban-net

volumes:
  dbData:
  redisData:

networks:
  kanban-net:
    driver: bridge
