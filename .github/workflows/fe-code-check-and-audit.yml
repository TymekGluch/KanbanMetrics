name: frontend code check and vulnerability audit
on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/fe-code-check-and-audit.yml"

defaults:
  run:
    working-directory: frontend

env:
  NODE_VERSION: "26.5.0"
  PNPM_VERSION: "11.17.0"

jobs:
  build:
    name: build (1/2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: install and build
        run: |
          pnpm ci
          pnpm build

  audit:
    name: audit (2/2)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: run vulnerability audit
        run: pnpm audit --audit-level high
